name: Staging smoke tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify deployed staging APIs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test staging chat and text-to-speech APIs
        run: node scripts/staging-smoke.mjs
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SMOKE_AUDIO_BASE64: ${{ secrets.STAGING_SMOKE_AUDIO_BASE64 }}
